name: OBO file validation

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # Validates the files as committed. On a source PR that is psi-ms-core.obo and the
  # column fragment; on the bot's update-release-obo PR it also covers the rebuilt
  # psi-ms.obo. Runs on every PR, so it can be a required status check; the hand-edit
  # guard for psi-ms.obo lives here rather than in a path-filtered workflow, which would
  # sit "Pending" on PRs it skips and block them if required.
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    container:
      # Pinned so the image's Python and fastobo-validator do not change under CI.
      image: obolibrary/odkfull:v1.6.1

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v4

    # Runs a single command using the runners shell
    - name: Validate OBO files
      # Each file is checked on its own so an error points at the file it is in.
      # Duplicates *across* core and fragment can only show up in the spliced file,
      # which the build-release job validates.
      run: |
        fastobo-validator --duplicates psi-ms-core.obo
        fastobo-validator --duplicates psi-ms-columns.obo-fragment
        fastobo-validator --duplicates psi-ms.obo
    # Use the container's own Python. actions/setup-python installs a Python built for the
    # runner host, which has no working ssl module inside obolibrary/odkfull, so pip
    # cannot reach PyPI. PIP_BREAK_SYSTEM_PACKAGES lets pip install into the image's
    # system Python on images that mark it externally managed; older pip ignores it.
    - name: Setup dependencies
      env:
        PIP_BREAK_SYSTEM_PACKAGES: "1"
      run: |
        python3 --version
        python3 -m pip install packaging fastobo==0.14.2
    - name: Check sorting
      run: |
        python3 scripts/check_sorted.py psi-ms-core.obo
        python3 scripts/check_sorted.py psi-ms-columns.obo-fragment
        python3 scripts/check_sorted.py psi-ms.obo
        python3 scripts/check_subsets.py psi-ms-core.obo

    - name: Splice and validate the release OBO this PR would produce
      run: |
        python3 scripts/build_release_obo.py --output /tmp/psi-ms.obo
        fastobo-validator --duplicates /tmp/psi-ms.obo
        python3 scripts/check_sorted.py /tmp/psi-ms.obo
        python3 scripts/check_subsets.py /tmp/psi-ms.obo

    # psi-ms.obo is generated by scripts/build_release_obo.py and only reaches master
    # through the release bot's update-release-obo PR (see HUPO-PSI/psi-ms-CV#561). Any
    # other PR that changes it fails. The bot is recognised by its branch name, and only
    # when that branch is in this repository: a fork can use the name, but not the repo.
    - name: psi-ms.obo may only be changed by the release bot
      if: >-
        github.event_name == 'pull_request' &&
        !(github.head_ref == 'update-release-obo' &&
          github.event.pull_request.head.repo.full_name == github.repository)
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git fetch --depth=1 origin "$BASE_REF"
        if ! git diff --quiet FETCH_HEAD -- psi-ms.obo; then
          echo "::error file=psi-ms.obo::psi-ms.obo is generated from psi-ms-core.obo and psi-ms-columns.obo-fragment after merge. Revert your changes to it and edit psi-ms-core.obo instead."
          exit 1
        fi
