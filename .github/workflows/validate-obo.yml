name: OBO file validation

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # fastobo-validator only ships in the ODK image.
  validate:
    runs-on: ubuntu-latest
    container: obolibrary/odkfull:v1.6.1
    steps:
    - uses: actions/checkout@v4
    - name: Validate committed OBO files
      run: |
        fastobo-validator --duplicates psi-ms-core.obo
        fastobo-validator --duplicates psi-ms-columns.obo-fragment
        fastobo-validator --duplicates psi-ms.obo
    - name: Validate the release OBO this PR would produce
      run: |
        python3 scripts/build_release_obo.py --output /tmp/psi-ms.obo
        fastobo-validator --duplicates /tmp/psi-ms.obo

  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install packaging fastobo==0.14.2
    - name: Check sorting and subsets
      run: |
        python scripts/build_release_obo.py --output /tmp/psi-ms.obo
        python scripts/check_sorted.py psi-ms-core.obo
        python scripts/check_sorted.py psi-ms-columns.obo-fragment
        python scripts/check_sorted.py psi-ms.obo
        python scripts/check_sorted.py /tmp/psi-ms.obo
        python scripts/check_subsets.py psi-ms-core.obo
        python scripts/check_subsets.py /tmp/psi-ms.obo

    # psi-ms.obo is generated: only the release bot's own PR may change it (#561).
    - name: psi-ms.obo may only be changed by the release bot
      if: >-
        github.event_name == 'pull_request' &&
        !(github.head_ref == 'update-release-obo' &&
          github.event.pull_request.head.repo.full_name == github.repository)
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        git fetch --depth=1 origin "$BASE_REF"
        if ! git diff --quiet FETCH_HEAD -- psi-ms.obo; then
          echo "::error file=psi-ms.obo::psi-ms.obo is generated from psi-ms-core.obo and psi-ms-columns.obo-fragment after merge. Revert your changes to it and edit psi-ms-core.obo instead."
          exit 1
        fi
