name: OBO file validation

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # Validates the files as committed. On a source PR that is psi-ms-core.obo and the
  # column fragment; on the bot's update-release-obo PR it also covers the rebuilt
  # psi-ms.obo.
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    container:
      image: obolibrary/odkfull

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v4

    # Runs a single command using the runners shell
    - name: Validate OBO files
      # Each file is checked on its own so an error points at the file it is in.
      # Duplicates *across* core and fragment can only show up in the spliced file,
      # which the build-release job validates.
      run: |
        fastobo-validator --duplicates psi-ms-core.obo
        fastobo-validator --duplicates psi-ms-columns.obo-fragment
        fastobo-validator --duplicates psi-ms.obo
    - uses: actions/setup-python@v6
      with:
          python-version: '3.12'
    - name: Setup dependencies
      run: |
        python -m pip install packaging fastobo
    - name: Check sorting
      run: |
        python scripts/check_sorted.py psi-ms-core.obo
        python scripts/check_sorted.py psi-ms-columns.obo-fragment
        python scripts/check_sorted.py psi-ms.obo
        python scripts/check_subsets.py psi-ms-core.obo

    - name: Splice and validate the release OBO this PR would produce
      run: |
        python scripts/build_release_obo.py --output /tmp/psi-ms.obo
        fastobo-validator --duplicates /tmp/psi-ms.obo
        python scripts/check_sorted.py /tmp/psi-ms.obo
        python scripts/check_subsets.py /tmp/psi-ms.obo