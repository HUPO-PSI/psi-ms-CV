name: "Build release OBO"

# Splices psi-ms-columns.obo-fragment into psi-ms-core.obo to produce psi-ms.obo, the
# release artefact.

on:
  push:
    branches: [master]
    paths:
      - "psi-ms-core.obo"
      - "psi-ms-columns.obo-fragment"
  workflow_dispatch: {}

jobs:
  build-obo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Splice the release OBO
        run: python scripts/build_release_obo.py

      - name: Validate the spliced release
        run: |
          python -m pip install fastobo
          python scripts/check_sorted.py psi-ms.obo

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PSI_MS_CV_GITHUB_TOKEN }}
          add-paths: psi-ms.obo
          commit-message: Update release OBO file
          committer: GitHub <noreply@github.com>
          author: GitHub <noreply@github.com>
          branch: update-release-obo
          delete-branch: true
          title: Update release OBO file
          body: |
            psi-ms.obo rebuilt from `psi-ms-core.obo` and `psi-ms-columns.obo-fragment`
            by `scripts/build_release_obo.py`.

            **This PR is the manual review gate for the release chain.** Please review and merge it to continue the release process.
            Auto-merge workflow to be re-enabled once the release chain is fully tested and stable.

      # Auto-merge is disabled, to introduce a temporary manual review gate for the release chain. 
      # Once the release chain is fully tested and stable, auto-merge can be re-enabled.
