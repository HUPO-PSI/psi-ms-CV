name: "Update OWL"

# Fires on the built psi-ms.obo, not its sources -- a source push would convert the
# pre-splice file. The two jobs are complements of the same guard: the psi-ms.obo push
# generates the OWL, and the merge of that OWL comes back here to be tagged.
on:
  push:
    branches: [master]
    paths:
      - "psi-ms.obo"
      - "psi-ms.owl"

jobs:
  generate-owl:
    if: ${{ ! contains(github.event.head_commit.message, 'Update OWL file') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Generate OWL
        run: |
          # Replace the imports of the UO and PATO ontology .obo files with the equivalent .owl files
          cp psi-ms.obo tmp.obo
          sed -e "s/pato.obo/pato.owl/g" -e "s/uo.obo/uo.owl/g" -i tmp.obo
          head -n 50 tmp.obo

          python -m pip install fastobo
          python scripts/prepare_template.py tmp.obo cv_template.tsv
          echo Generated template with `wc -l cv_template.tsv`

          wget -nv --no-check-certificate https://github.com/ontodev/robot/releases/download/v1.9.5/robot.jar
          export JAVA_TOOL_OPTIONS=-Xmx6G
          # java -jar robot.jar -vvv template -p "PEFF: http://purl.obolibrary.org/obo/PEFF_" -i psi-ms.obo -t cv_template.tsv convert -f ofn -o psi-ms.owl
          java -jar robot.jar convert -v -i tmp.obo -o psi-ms.owl --format owl
          rm *robot.jar*
          rm *tmp.obo* *cv_template.tsv*
      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.PSI_MS_CV_GITHUB_TOKEN }}
          commit-message: Update OWL file
          committer: GitHub <noreply@github.com>
          author: GitHub <noreply@github.com>
          branch: update-owl-file
          delete-branch: true
          title: Update OWL file
          body: This automated PR updates the OWL file corresponding to the OBO file
      - name: Approve pull request
        if: (steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated')
        uses: juliangruber/approve-pull-request-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          number: ${{ steps.cpr.outputs.pull-request-number }}
      - name: Merge pull request
        if: (steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated')
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.PSI_MS_CV_GITHUB_TOKEN }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: squash

  # Tags the OWL merge commit, which is the first commit holding both the OBO and the OWL
  # built from it. Tagging in generate-owl tagged the psi-ms.obo commit one earlier, and
  # make-release-on-tag checks out the tag, so every release shipped the previous OWL.
  tag:
    if: ${{ contains(github.event.head_commit.message, 'Update OWL file') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # github-tag-action reads git history. custom_tag bypasses its bump calculation,
          # which is why a shallow clone has worked, but it is documented as needing the
          # full history and the guard below wants the tags anyway.
          fetch-depth: 0

      - name: Extract version from OBO
        run: |
          CV_VERSION=$(grep -m1 '^data-version:' psi-ms.obo | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "CV_VERSION=${CV_VERSION}" >> $GITHUB_ENV

      - name: Assert the OWL was built from this OBO
        # The commit-message gate is what lands this job on the right commit. This turns the
        # invariant that gate exists to protect into a hard failure instead of a silently
        # wrong release: every release up to and including v4.1.257 would have failed here.
        run: |
          OWL_VERSION=$(grep -m1 'owl:versionIRI' psi-ms.owl | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "psi-ms.obo data-version: ${CV_VERSION}"
          echo "psi-ms.owl versionIRI:   ${OWL_VERSION}"
          if [ "${CV_VERSION}" != "${OWL_VERSION}" ]; then
            echo "::error::psi-ms.owl is built from '${OWL_VERSION}', not '${CV_VERSION}' -- refusing to tag."
            exit 1
          fi

      - name: Skip if already tagged
        # Reachable whenever this job runs at an unchanged data-version -- a revert commit
        # (whose subject still contains 'Update OWL file'), or a hand-edited psi-ms.owl that
        # generate-owl regenerates and merges back under that same subject.
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${CV_VERSION}" >/dev/null 2>&1; then
            echo "::notice::v${CV_VERSION} is already tagged; nothing to release."
            echo "ALREADY_TAGGED=true" >> $GITHUB_ENV
          fi

      - name: GitHub Tag
        if: env.ALREADY_TAGGED != 'true'
        # The PAT is required: a tag pushed with GITHUB_TOKEN does not trigger further
        # workflows, so make-release-on-tag would never fire.
        uses: mathieudutour/github-tag-action@v5.6
        with:
          github_token: ${{ secrets.PSI_MS_CV_GITHUB_TOKEN }}
          pre_release_branches: test-tag
          custom_tag: ${{ env.CV_VERSION }}
